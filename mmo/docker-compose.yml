services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tutiengioi
      POSTGRES_USER: tutien
      POSTGRES_PASSWORD: tutien
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutien -d tutiengioi"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tutien:tutien@postgres:5432/tutiengioi?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: pnpm --filter @ttg/worker start
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tutien:tutien@postgres:5432/tutiengioi?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
